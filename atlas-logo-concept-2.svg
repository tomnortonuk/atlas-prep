<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- ATLAS Logo Concept 2: Grid Network with Central Node -->
  <!-- Deep Teal: #0A5C5F -->
  
  <defs>
    <style>
      .primary { fill: #0A5C5F; }
      .secondary { fill: #3B7A7D; }
      .accent { fill: #D97E3F; }
      .line { stroke: #0A5C5F; stroke-width: 3; fill: none; }
    </style>
  </defs>
  
  <!-- Grid structure -->
  <line class="line" opacity="0.3" x1="50" y1="70" x2="150" y2="70"/>
  <line class="line" opacity="0.3" x1="50" y1="100" x2="150" y2="100"/>
  <line class="line" opacity="0.3" x1="50" y1="130" x2="150" y2="130"/>
  <line class="line" opacity="0.3" x1="70" y1="50" x2="70" y2="150"/>
  <line class="line" opacity="0.3" x1="100" y1="50" x2="100" y2="150"/>
  <line class="line" opacity="0.3" x1="130" y1="50" x2="130" y2="150"/>
  
  <!-- Outer nodes -->
  <circle class="secondary" cx="70" cy="70" r="8"/>
  <circle class="secondary" cx="130" cy="70" r="8"/>
  <circle class="secondary" cx="70" cy="130" r="8"/>
  <circle class="secondary" cx="130" cy="130" r="8"/>
  
  <!-- Connection paths (highlighted) -->
  <path class="line" d="M 70 70 L 100 100" stroke-width="4" opacity="0.6"/>
  <path class="line" d="M 130 70 L 100 100" stroke-width="4" opacity="0.6"/>
  <path class="line" d="M 70 130 L 100 100" stroke-width="4" opacity="0.6"/>
  <path class="line" d="M 130 130 L 100 100" stroke-width="4" opacity="0.6"/>
  
  <!-- Central anchor node -->
  <circle class="primary" cx="100" cy="100" r="16"/>
  <circle class="accent" cx="100" cy="100" r="6"/>
</svg>