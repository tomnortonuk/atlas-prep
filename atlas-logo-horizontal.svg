<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- ATLAS Logo - Full Horizontal (Icon + Wordmark) -->
  <!-- Using Concept 3: Layered Cartographic Planes -->
  
  <defs>
    <style>
      .layer1 { fill: #527A6E; }
      .layer2 { fill: #3B7A7D; }
      .layer3 { fill: #0A5C5F; }
      .accent { fill: #D97E3F; }
      .wordmark { fill: #2C3E42; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 48px; letter-spacing: -0.02em; }
    </style>
  </defs>
  
  <!-- Icon (scaled and positioned) -->
  <g transform="translate(10, 10)">
    <!-- Back layer -->
    <rect class="layer1" x="15" y="25" width="70" height="70" rx="4" opacity="0.4" transform="rotate(-5 50 60)"/>
    
    <!-- Middle layer -->
    <rect class="layer2" x="20" y="30" width="60" height="60" rx="4" opacity="0.6" transform="rotate(3 50 60)"/>
    
    <!-- Front layer -->
    <rect class="layer3" x="25" y="35" width="50" height="50" rx="4"/>
    
    <!-- Corner marks -->
    <path class="accent" d="M 30 40 L 30 37 L 33 37" stroke="#D97E3F" stroke-width="1.5" fill="none"/>
    <path class="accent" d="M 70 40 L 70 37 L 67 37" stroke="#D97E3F" stroke-width="1.5" fill="none"/>
    <path class="accent" d="M 30 80 L 30 83 L 33 83" stroke="#D97E3F" stroke-width="1.5" fill="none"/>
    <path class="accent" d="M 70 80 L 70 83 L 67 83" stroke="#D97E3F" stroke-width="1.5" fill="none"/>
    
    <!-- Center crosshair -->
    <circle fill="#FFFFFF" cx="50" cy="60" r="3"/>
    <line x1="50" y1="56" x2="50" y2="64" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="46" y1="60" x2="54" y2="60" stroke="#FFFFFF" stroke-width="1"/>
  </g>
  
  <!-- Wordmark -->
  <text class="wordmark" x="130" y="75">ATLAS</text>
</svg>