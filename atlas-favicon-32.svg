<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- ATLAS Favicon - 32x32 Simplified Icon -->
  
  <defs>
    <style>
      .layer1 { fill: #527A6E; }
      .layer2 { fill: #3B7A7D; }
      .layer3 { fill: #0A5C5F; }
      .accent { fill: #D97E3F; }
    </style>
  </defs>
  
  <!-- Simplified layered squares -->
  <rect class="layer1" x="6" y="8" width="18" height="18" rx="2" opacity="0.5" transform="rotate(-5 15 17)"/>
  <rect class="layer2" x="7" y="9" width="16" height="16" rx="2" opacity="0.7" transform="rotate(3 15 17)"/>
  <rect class="layer3" x="8" y="10" width="14" height="14" rx="1.5"/>
  
  <!-- Center marker -->
  <circle fill="#FFFFFF" cx="15" cy="17" r="2"/>
  <circle class="accent" cx="15" cy="17" r="0.8"/>
</svg>